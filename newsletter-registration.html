<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>newsletter_registration | DRIES_BORMANS</title>
  <meta name="description" content="Register for news from Dries Bormans.">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="page" id="top">

  <nav class="menu">
    <a href="index.html">home</a>
    <a href="links.html">links</a>
    <a href="shop.html">shop</a>
    <a href="newsletter-registration.html" class="active">newsletter_registration</a>
    <a href="compliance-stuff.html">compliance stuff</a>
  </nav>

  <main>
    <div class="form-box">
      <h1 class="hl">Register for News from Dries Bormans</h1>

      <!-- Les inscriptions arrivent par e-mail sur info@driesbormans.com (via FormSubmit). -->
      <form id="newsletter" data-endpoint="https://formsubmit.co/ajax/info@driesbormans.com">
        <input type="hidden" name="_subject" value="New newsletter registration — driesbormans.com">
        <input type="hidden" name="_template" value="table">
        <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off">

        <div class="row">
          <div class="field">
            <label for="first">First name</label>
            <input type="text" id="first" name="first_name" autocomplete="given-name">
          </div>
          <div class="field">
            <label for="last">Last name</label>
            <input type="text" id="last" name="last_name" autocomplete="family-name">
          </div>
        </div>

        <div class="field">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>

        <div class="field">
          <label for="from">Where are you from?</label>
          <input type="text" id="from" name="where_from" placeholder="City, State, Country">
        </div>

        <div class="field half">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel">
        </div>

        <div class="field">
          <span class="q">Want Dries to come to your city?</span>
          <label class="radio"><input type="radio" name="come_to_my_city" value="Yes"> Yes</label>
          <label class="radio"><input type="radio" name="come_to_my_city" value="No"> No</label>
        </div>

        <button type="submit" class="submit">submit_</button>
        <p class="form-status" id="status" aria-live="polite"></p>
      </form>
    </div>
  </main>

  <footer>
    <div class="legal-links">
      <a href="compliance-stuff.html#terms">terms &amp; conditions</a>
      <a href="compliance-stuff.html#privacy">privacy policy</a>
      <a href="compliance-stuff.html">&amp; other website compliance stuff</a>
    </div>
    <div>
      <p class="stars">⛧⛤</p>
      <a class="home-star" href="index.html">home*</a>
      <p class="copy">© 2026 by Dries Bormans</p>
    </div>
    <div></div>
  </footer>

</div>

<script>
  (function () {
    var form = document.getElementById('newsletter');
    var status = document.getElementById('status');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var data = {};
      new FormData(form).forEach(function (v, k) { data[k] = v; });
      var btn = form.querySelector('button');
      btn.disabled = true;
      status.textContent = 'sending...';
      fetch(form.dataset.endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(data)
      })
        .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function () {
          form.innerHTML = '<p class="headline" style="text-align:center;margin:20px 0">Thanks for registering!</p>';
        })
        .catch(function () {
          btn.disabled = false;
          status.innerHTML = 'something went wrong --- please try again or email <a href="mailto:info@driesbormans.com">info@driesbormans.com</a>';
        });
    });
  })();
</script>
</body>
</html>
